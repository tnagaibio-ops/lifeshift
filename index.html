<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ea">
<title>バイオ人生ゲーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f3ea; --card:#fffdf8; --ink:#23262b; --sub:#6b6f76; --line:#e6dfd0;
  --accent:#0f766e; --accent-d:#0b5b55; --accent-l:#d9efe9;
  --good:#b7791f; --bad:#c53030; --pos:#1f8a5b; --neg:#c53030;
  --round:'Zen Maru Gothic', -apple-system, 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
  font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
h1,h2,h3,h4{font-family:var(--round);line-height:1.35;margin:0}
h2{font-size:22px;font-weight:700}
p{margin:0}
.muted{color:var(--sub);font-size:14px}
.fine{color:var(--sub);font-size:12px;margin-top:12px}
.center{text-align:center}
.pos{color:var(--pos)} .neg{color:var(--neg)}

/* ボタン */
.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;font:700 17px var(--round);margin-top:20px;cursor:pointer;
  transition:transform .08s, opacity .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-d)}
.btn.primary:disabled{opacity:.4;box-shadow:none}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent);margin-top:12px}

/* タイトル */
.hero{padding:48px 4px 24px;text-align:center}
.badge{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-l);border-radius:999px;padding:4px 12px}
.logo{font-size:44px;font-weight:900;letter-spacing:.04em;margin:18px 0 12px;line-height:1.15;
  background:linear-gradient(135deg,#0f766e,#2f9e6b 50%,#c98a00);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--sub)}
.howto{list-style:none;padding:0;margin:24px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.howto li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:14px;font-weight:600}
.howto b{margin-right:6px}
.field{display:block;text-align:left;margin-top:8px}
.field span{font-size:13px;font-weight:700;color:var(--sub)}
.field input{width:100%;margin-top:4px;padding:14px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:17px;color:var(--ink)}
.field input:focus{outline:none;border-color:var(--accent)}

/* 画面共通 */
.screen{padding-top:20px}
.step{font:700 13px var(--round);color:var(--accent);letter-spacing:.08em;margin-bottom:4px}
.screen > h2{margin-bottom:8px}
.list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 2px 0 var(--line)}
.card h3{font-size:16px;margin-bottom:8px}

/* 価値観 */
.opt{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;
  font:inherit;font-weight:600;text-align:left;cursor:pointer;color:var(--ink)}
.opt:active{border-color:var(--c)}
.opt-ic{font-size:24px}

/* 進路カード */
.card-opt{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;color:var(--ink);font:inherit}
.card-opt.sel{border-color:var(--accent);background:#f1faf7;box-shadow:0 0 0 3px var(--accent-l)}
.co-head{display:flex;align-items:center;gap:8px}
.co-ic{font-size:24px}
.co-name{font:700 16px var(--round)}
.co-desc{font-size:13px;color:var(--sub);margin:6px 0 8px;line-height:1.6}
.co-stars{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:12px}
.co-stars span{display:flex;justify-content:space-between}
.co-stars b{color:#e0a100;letter-spacing:1px}
.co-stars em{color:#e3ddcf;font-style:normal}
.sticky-bottom{position:sticky;bottom:0;padding:8px 0 calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}

/* 上部バー */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin:0 -16px;padding-left:16px;padding-right:16px}
.top-row{display:flex;align-items:baseline;gap:10px}
.age{font:900 26px var(--round);color:var(--accent)}
.age small{font-size:13px;font-weight:700;margin-left:2px}
.job{font-size:13px;font-weight:600;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:right}
.dots{display:flex;gap:4px;margin:6px 0 8px}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.dots i.done{background:var(--accent)}
.dots i.now{background:#7cc4b6}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 4px 4px;min-width:0}
.stat-top{display:flex;flex-direction:column;align-items:center;line-height:1.25}
.stat-ic{font-size:13px}
.stat-v{font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.02em}
.stat-bar{height:4px;background:#efe9dc;border-radius:2px;margin:3px 0 2px;overflow:hidden}
.stat-bar i{display:block;height:100%;background:var(--c);border-radius:2px;transition:width .5s}
.stat-l{font-size:10px;color:var(--sub);text-align:center;white-space:nowrap}

/* ステージ開始 */
.stage-hero{text-align:center;padding:12px 0 4px}
.big-age{font:900 44px var(--round);color:var(--accent);margin:2px 0}
.stage-name{font:700 16px var(--round);color:var(--sub)}
.ledger{list-style:none;padding:0;margin:0}
.ledger li{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.ledger li:first-child{border-top:0}
.li-t{flex:1}
.ledger b{white-space:nowrap}

/* ルーレット */
.legend{display:flex;justify-content:center;gap:6px;margin:10px 0;flex-wrap:wrap}
.lg{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.lg.bad{background:#f8d7d5;color:#a1312b}
.lg.normal{background:#dcebe6;color:#2d6b5c}
.lg.good{background:#ffe6ae;color:#8a5a00}
.wheel-wrap{position:relative;width:260px;max-width:78vw;margin:16px auto 0;aspect-ratio:1}
.wheel{width:100%;height:100%;transition:transform 3.2s cubic-bezier(.12,.72,.12,1)}
.wheel-svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.08))}
.wnum{font:900 20px var(--round);fill:#23262b}
.pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;z-index:2;
  border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--ink)}
.spinout{min-height:64px;margin-top:14px}
.spin-res{display:inline-flex;align-items:center;gap:10px;font:700 20px var(--round);padding:8px 18px;border-radius:999px;animation:pop .35s}
.spin-res b{font-size:30px}
.spin-res.bad{background:#f8d7d5;color:#a1312b}
.spin-res.normal{background:#dcebe6;color:#2d6b5c}
.spin-res.good{background:#ffe6ae;color:#8a5a00}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* イベント */
.luck{font:700 13px var(--round);border-radius:10px;padding:6px 12px;display:inline-block}
.luck.bad{background:#f8d7d5;color:#a1312b}
.luck.normal{background:#dcebe6;color:#2d6b5c}
.luck.good{background:#ffe6ae;color:#8a5a00}
.event h2,.result h2{font-size:21px}
.ev-age{font-size:12px;font-weight:700;color:var(--sub)}
.ev-text{margin-top:10px}
.ask{font:700 15px var(--round);margin-top:18px;color:var(--sub)}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:#fff;border:2px solid var(--line);border-left:6px solid var(--accent);
  border-radius:14px;padding:14px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--line)}
.choice:active{background:#f1faf7}
.ch-t{font-weight:700;font-size:16px}
.hint{font-size:12px;color:var(--sub);background:#f3efe5;border-radius:6px;padding:1px 8px}

/* 結果 */
.picked{font-weight:700;color:var(--accent);margin-top:8px}
.res-text{margin-top:10px}
.roll{margin-top:10px;font-size:14px;border-radius:10px;padding:8px 12px}
.roll.ok{background:#e1f3ea} .roll.ng{background:#fbe4e2}
.roll small{display:block;color:var(--sub);font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font-size:13px;border-radius:999px;padding:4px 10px;animation:pop .35s both}
.chip.up{background:#e1f3ea;color:#17603f}
.chip.down{background:#fbe4e2;color:#9b2c2c}
.notes{margin:12px 0 0;padding-left:18px;font-size:13px;color:var(--sub)}

/* エンディング */
.ending{padding-top:24px}
.result-card{background:#fff;border-radius:24px;overflow:hidden;border:1px solid var(--line);box-shadow:0 6px 0 var(--line)}
.rc-head{background:linear-gradient(135deg,#0f766e,#2f9e6b);color:#fff;padding:20px 18px 18px;text-align:center}
.rc-name{font-size:13px;opacity:.9}
.rc-kicker{font-size:11px;letter-spacing:.2em;opacity:.8;margin-top:8px}
.rc-title{font:900 24px var(--round);margin:2px 0 6px;text-wrap:balance;word-break:auto-phrase}
.rc-desc{font-size:13px;opacity:.95;line-height:1.6}
.rc-score{text-align:center;padding:16px 0 0}
.rc-score .num{font:900 64px var(--round);color:var(--accent);line-height:1}
.rc-score .unit{font:900 22px var(--round);color:var(--accent);margin-left:2px}
.rc-score small{display:block;font-size:12px;color:var(--sub)}
.radar{width:100%;max-width:300px;display:block;margin:0 auto}
.rl{font-size:11px;font-weight:700;fill:#4b4f56}
.rv-row{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:0 10px}
.rv{display:flex;flex-direction:column;align-items:center;background:#faf7f0;border-radius:10px;padding:6px 2px;border-top:3px solid var(--c)}
.rv b{font-size:14px;font-variant-numeric:tabular-nums}
.rv small{font-size:10px;color:var(--sub)}
.rv em{font-style:normal;font-size:11px;font-weight:700;color:var(--c)}
.rc-path{text-align:center;font-size:13px;font-weight:700;padding:12px 12px 0}
.rc-foot{text-align:center;font-size:11px;color:var(--sub);padding:8px 0 14px;letter-spacing:.1em}
.shot-note{text-align:center;font-weight:700;margin-top:14px;font-size:14px}
.sec{margin-top:28px}
.sec h3{font-size:18px;border-left:5px solid var(--accent);padding-left:10px;margin-bottom:10px}
.fb{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.fb h4{font-size:15px;margin-bottom:4px}
.fb p{font-size:14px}
.timeline{list-style:none;padding:0;margin:0;border-left:3px solid var(--accent-l);margin-left:22px}
.timeline li{position:relative;padding:6px 0 6px 14px;font-size:14px;display:flex;gap:10px}
.timeline li::before{content:'';position:absolute;left:-8px;top:14px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.tl-age{font-weight:800;color:var(--accent);min-width:3.2em;font-variant-numeric:tabular-nums}
.tips{padding-left:20px;margin:0;font-size:14px}
.tips li{margin:6px 0}
.q ol{padding-left:20px;margin:0;background:#fff8e6;border:1px solid #f1dfae;border-radius:14px;padding:14px 14px 14px 34px;font-size:15px}
.q li{margin:6px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
// =====================================================================
//  データ（ここを編集すれば、文言・数値・イベントを変更できます）
// ---------------------------------------------------------------------
//  パラメータ：money（資産・万円）/ health / skill / bond / joy（0〜100）
//  イベントの項目
//    pool    : どの場面で出るか（下の STAGES と luck_good / luck_normal /
//              luck_bad / followup）
//    careers : その職業のときだけ出る（省略すると全員）
//    when    : 出る条件（s.flags / s.stats / s.stage / s.career が使える）
//    weight  : 出やすさ（省略時 1）
//    options : 選択肢。省略すると、そのまま effect が反映される
//      effect : パラメータの変化     set / inc : フラグの変更
//      career : 職業を変える         jobChange : 同じ職種で転職（退職金精算）
//      roll   : 成功・失敗が運で決まる（stat が高いほど成功しやすい）
//      ethics : 'comply' | 'speak' | 'formal'（倫理イベントでの選択）
//    tip     : 結果画面の「知っておきたいこと」に載る豆知識
// =====================================================================

const VALUES = {
  money:  'お金・経済的な安定',
  health: '心と体の健康',
  skill:  '専門性・成長',
  bond:   '家族や仲間とのつながり',
  joy:    'やりがい・好きなこと',
};

const CAREERS = {
  pharma:  { name:'製薬・バイオ研究職', short:'研究職', icon:'🧪', start:true, income:300, retire:1500,
             desc:'新薬や新技術の研究開発。成果へのプレッシャーは大きいが、専門性とやりがいが伸びる。',
             init:{ skill:10, joy:5 }, stars:{ 収入:4, 安定:3, 専門性:5, 自由度:2 } },
  food:    { name:'食品メーカー（品質管理・開発）', short:'食品メーカー', icon:'🍱', start:true, income:230, retire:1100,
             desc:'毎日の食卓を支える仕事。安定しやすいが、品質と安全を守る責任は重い。',
             init:{ skill:5, health:5, bond:5 }, stars:{ 収入:3, 安定:4, 専門性:3, 自由度:3 } },
  cosme:   { name:'化粧品メーカー', short:'化粧品メーカー', icon:'💄', start:true, income:240, retire:1000,
             desc:'研究・開発から企画・マーケティングまで。流行の変化が速く、発想力が活きる。',
             init:{ skill:5, joy:10 }, stars:{ 収入:3, 安定:3, 専門性:3, 自由度:4 } },
  cro:     { name:'臨床検査・CRO（治験）', short:'CRO', icon:'🩺', start:true, income:260, retire:900,
             desc:'医薬品の開発や医療の検査を支える。経験を積めば転職市場で強い。',
             init:{ skill:10 }, stars:{ 収入:3, 安定:4, 専門性:4, 自由度:3 } },
  civil:   { name:'公務員（技術職）', short:'公務員', icon:'🏛️', start:true, income:230, retire:1800,
             desc:'保健所や試験研究機関で地域の安全を守る。収入は堅実で、数年ごとに異動がある。',
             init:{ health:5, bond:5 }, stars:{ 収入:3, 安定:5, 専門性:3, 自由度:2 } },
  other:   { name:'異業種（IT・営業など）', short:'異業種', icon:'💼', start:true, income:270, retire:900, spread:120,
             desc:'バイオの外の世界へ。収入が伸びる可能性はあるが、学んだ専門からは離れる。',
             init:{ skill:-5, joy:5 }, stars:{ 収入:4, 安定:2, 専門性:2, 自由度:4 } },
  grad:    { name:'大学院進学（修士課程）', short:'大学院', icon:'🎓', start:true, income:-150, retire:0, noTenure:true,
             desc:'「高度専門士」の称号で大学院へ。研究を深め、研究者への道も開ける。学費と時間がかかる。',
             init:{ skill:15, joy:5 }, stars:{ 収入:1, 安定:2, 専門性:5, 自由度:4 } },
  // ↓ 途中から選べる道
  doctor:  { name:'大学院（博士課程）', short:'博士課程', icon:'📚', income:-80, retire:0, noTenure:true },
  academia:{ name:'研究者（大学・研究機関）', short:'研究者', icon:'🔭', income:170, retire:900 },
  startup: { name:'起業家（バイオベンチャー）', short:'起業家', icon:'🚀', income:80, retire:0, spread:300, noTenure:true },
  indep:   { name:'独立・フリーランス', short:'フリーランス', icon:'🧭', income:120, retire:0, spread:80, noTenure:true },
  retired: { name:'リタイア生活', short:'リタイア', icon:'🌿', income:-150, retire:0, noTenure:true },
};

// ステージ（約5年ごと）と、各ステージで出る選択イベントの種類
const STAGES = [
  { age:[22,25], name:'社会人デビュー', pools:['first_year','career_start'] },
  { age:[25,30], name:'20代後半',       pools:['career_mid','life_partner'] },
  { age:[30,35], name:'30代前半',       pools:['ethics','family'] },
  { age:[35,40], name:'30代後半',       pools:['career_path','midlife'] },
  { age:[40,45], name:'40代前半',       pools:['midlife'] },
  { age:[45,50], name:'40代後半',       pools:['care','health'] },
  { age:[50,55], name:'50代前半',       pools:['late_career','health'] },
  { age:[55,60], name:'50代後半',       pools:['pre_retire','pre_retire'] },
  { age:[60,65], name:'60代前半',       pools:['second_life'] },
];

const COMPANY = ['pharma','food','cosme','cro','other'];
const LAB = ['pharma','academia','doctor','grad'];

const EVENTS = [


// ===== 社会人1年目（ステージ1の追加イベント）=====
{ id:'fy_bonus', pool:'first_year', when:s=>s.career!=='grad',
  title:'初めてのボーナス',
  text:'社会人になって初めてのボーナスが出た。何に使う？',
  options:[
    { label:'親にプレゼントを贈る', effect:{ bond:8, money:-10 },
      result:'「立派になったね」と、親がうれしそうだった。', log:'初ボーナスで親にプレゼント' },
    { label:'貯金・積立を始める', effect:{ money:40 },
      result:'給料が出たら先に貯める。小さな習慣が将来を変える。', log:'積立貯金を始める',
      tip:'給料が入ったら先に一定額を貯める「先取り貯蓄」は、お金を貯める基本の方法です。' },
    { label:'自分へのご褒美に旅行する', effect:{ joy:8, money:-30 },
      result:'がんばった自分へのご褒美。いい思い出になった。', log:'初ボーナスで旅行' },
    { label:'資格の勉強に使う', effect:{ skill:5, money:-20 },
      result:'自分への投資。参考書と講座で学びはじめた。', log:'初ボーナスを自己投資に' },
  ] },
{ id:'fy_living', pool:'first_year',
  title:'どこに住む？',
  text:'新生活のスタート。住む場所を決めよう。',
  options:[
    { label:'職場の近くで一人暮らし', effect:{ health:3, joy:5, money:-80 },
      result:'通勤はラク。家事は全部自分でやることに。', log:'一人暮らしを始める' },
    { label:'実家から通う', effect:{ money:80, bond:3, joy:-2 },
      result:'お金は貯まる。通勤時間は長いけれど。', log:'実家から通う' },
    { label:'友人とシェアハウス', effect:{ bond:8, joy:4, money:-20 },
      result:'にぎやかな毎日。家事の分担でもめることも。', log:'友人とシェアハウス' },
  ] },
{ id:'fy_holiday', pool:'first_year',
  title:'休日の過ごし方',
  text:'慣れない毎日で、休日はくたくた。どう過ごす？',
  options:[
    { label:'学生時代の仲間と集まる', effect:{ bond:6, joy:4, money:-10 },
      result:'同じように頑張る仲間の話に、元気をもらった。', log:'学生時代の仲間と集まる' },
    { label:'新しい趣味を始める', effect:{ joy:8, money:-20 },

<script>
// =====================================================================
//  ゲームロジック（画面に依存しない部分）
// =====================================================================
const STAT_KEYS = ['money','health','skill','bond','joy'];
const META = {
  money:  { label:'資産',     icon:'💰', color:'#c98a00' },
  health: { label:'健康',     icon:'❤️', color:'#e5484d' },
  skill:  { label:'スキル',   icon:'🔬', color:'#3e63dd' },
  bond:   { label:'つながり', icon:'🤝', color:'#2f9e6b' },
  joy:    { label:'充実感',   icon:'✨', color:'#8e4ec6' },
};
const MONEY_FULL = 4000;     // 資産 4000万円で満点（20点）
const RETIRE_FULL_TENURE = 7; // 勤続 7ステージ（約35年）で退職金満額
const CHILD_COST = 120;      // 子ども1人あたり・1ステージ（5年）の費用（万円）
const SIDE_INCOME = 80;      // 副業の収入（1ステージ）

let S = null;

function newState(){
  return {
    phase:'title', name:'', value:null, stage:-1, sub:0,
    career:null, careers:[],
    stats:{ money:50, health:80, skill:30, bond:50, joy:50 },
    flags:{ rank:0, tenure:0, children:0 },
    queue:[], current:null, used:[], spin:null, pending:null, intro:null,
    log:[], tips:[], luck:{ good:0, normal:0, bad:0 }, ethics:null, retire:null,
  };
}

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rand = () => Math.random();

function curAge(){
  const st = STAGES[S.stage];
  if (!st) return 22;
  return Math.min(st.age[0] + S.sub, st.age[1] - 1);
}

function careerOk(ev){
  if (ev.careers && !ev.careers.includes(S.career)) return false;
  if (ev.when && !ev.when(S)) return false;
  return true;
}

function pickWeighted(list){
  const total = list.reduce((a,e)=>a+(e.weight||1),0);
  let r = rand()*total;
  for (const e of list){ r -= (e.weight||1); if (r<=0) return e; }
  return list[list.length-1];
}

function pickEvent(pool){
  let list = EVENTS.filter(e => e.pool===pool && careerOk(e));
  const fresh = list.filter(e => !S.used.includes(e.id));
  if (fresh.length) list = fresh;
  else if (pool.startsWith('luck')) list = list; // ルーレットは使い回し可
  else return null;
  return list.length ? pickWeighted(list) : null;
}

function getEvent(id){ return EVENTS.find(e=>e.id===id); }

// ---------- 職業 ----------
function chooseCareer(id){
  S.career = id;
  S.careers = [id];
  S.flags.tenure = 0;
  addStats(CAREERS[id].init || {});
}

function payRetirement(notes){
  const c = CAREERS[S.career];
  if (!c || !c.retire || S.flags.tenure<=0) return 0;
  const amt = Math.round(c.retire * Math.min(1, S.flags.tenure / RETIRE_FULL_TENURE));
  S.stats.money += amt;
  if (notes) notes.push(`${c.short}を退職。退職金 ${fmtMoney(amt)}`);
  return amt;
}

function changeCareer(id, notes){
  if (id === S.career) return;
  payRetirement(notes);
  S.career = id;
  if (S.careers[S.careers.length-1] !== id) S.careers.push(id);
  S.flags.tenure = 0;
  S.flags.rank = 0;
  notes.push(`${CAREERS[id].icon} ${CAREERS[id].name}の道へ`);
}

// ---------- パラメータ ----------
function addStats(eff){
  for (const k of STAT_KEYS){
    if (eff[k]==null) continue;
    if (k==='money') S.stats.money += eff[k];
    else {
      let d = eff[k];
      // 高い値ほど上がりにくい（伸びしろの考え方）
      if (d > 0) d = Math.max(1, Math.round(d * (1 - Math.max(0, S.stats[k] - 40) / 90)));
      S.stats[k] = clamp(S.stats[k] + d, 0, 100);
    }
  }
}

function applyOutcome(o, notes){
  if (!o) return;
  if (o.jobChange && !CAREERS[S.career].noTenure){ payRetirement(notes); S.flags.tenure = 0; notes.push('転職。勤続年数はリセット'); }
  if (o.effect){ addStats(typeof o.effect==='function' ? o.effect(S) : o.effect); }
  if (o.set){
    for (const [k,v] of Object.entries(o.set)){
      S.flags[k] = v;
      if (v===true) S.flags[k+'At'] = S.stage;
    }
  }
  if (o.inc){
    for (const [k,v] of Object.entries(o.inc)) S.flags[k] = Math.max(0, (S.flags[k]||0) + v);
  }
  if (o.career) changeCareer(o.career, notes);
}

function rollProb(r){
  const v = r.stat ? S.stats[r.stat] : 50;
  return clamp(r.base + (v - 50) / 150, 0.1, 0.9);
}

// 選択肢を解決して、結果画面用のデータを返す
function resolve(ev, opt){
  const before = { ...S.stats };
  const notes = [];
  let out = opt, roll = null;
  if (opt.roll){
    const p = rollProb(opt.roll);
    const ok = rand() < p;
    roll = { p, ok, stat: opt.roll.stat };
    applyOutcome(opt, notes);           // 選択肢そのものの set（倫理フラグなど）
    out = ok ? opt.roll.success : opt.roll.fail;
  }
  applyOutcome(out, notes);

  const deltas = {};
  for (const k of STAT_KEYS){ const d = S.stats[k]-before[k]; if (d) deltas[k]=d; }

  const logText = out.log || opt.log || ev.log || `${ev.title}${opt.label ? '：'+opt.label : ''}`;
  S.log.push({ age: curAge(), text: logText, pool: ev.pool });
  S.sub++;

  if (opt.ethics) S.ethics = { kind: opt.ethics, title: ev.title };
  for (const t of [ev.tip, opt.tip, out.tip]) if (t && !S.tips.includes(t)) S.tips.push(t);

  S.pending = {
    eventId: ev.id, title: ev.title,
    choice: opt.label || null,
    result: out.result || opt.result || ev.result || ev.text,
    deltas, roll, notes,
  };
}

// ---------- ステージ進行 ----------
function startStage(i){
  S.stage = i; S.sub = 0; S.spin = null;
  const st = STAGES[i];
  const c = CAREERS[S.career];
  const lines = [];
  const before = { ...S.stats };

  if (!c.noTenure) S.flags.tenure++;

  let inc = c.income;
  if (c.spread) inc += Math.round((rand()*2-1) * c.spread);
  if (inc > 0) inc = Math.round(inc * (1 + 0.3 * S.flags.rank));
  S.stats.money += inc;
  lines.push({ icon:c.icon, text: inc>=0 ? `${c.short}としての収入（生活費を引いた貯金）` : `${c.short}の学費・生活費`, money:inc });

  if (S.flags.side && !['retired'].includes(S.career)){
    S.stats.money += SIDE_INCOME;
    lines.push({ icon:'📝', text:'副業の収入', money:SIDE_INCOME });
  }
  if (S.flags.children>0 && S.flags.childAt!=null && i - S.flags.childAt < 4){
    const cost = CHILD_COST * S.flags.children;
    S.stats.money -= cost;
    lines.push({ icon:'👶', text:'子育ての費用', money:-cost });
  }
  let decay = 0;
  if (i>=4) decay = 3;
  if (i>=6) decay = 5;
  if (i>=8) decay = 6;
  if (decay){
    S.stats.health = clamp(S.stats.health - decay, 0, 100);
    lines.push({ icon:'🕰️', text:'年齢とともに体力が少しずつ落ちる', stat:'health', value:-decay });
  }

  const deltas = {};
  for (const k of STAT_KEYS){ const d = S.stats[k]-before[k]; if (d) deltas[k]=d; }
  S.intro = { lines, deltas };

  // このステージで起きることの順番
  const q = [];
  const fu = EVENTS.filter(e => e.pool==='followup' && !S.used.includes(e.id) && careerOk(e));
  for (const e of fu){ if (rand() < (e.chance ?? 1)){ q.push({ type:'event', id:e.id }); break; } }
  q.push({ type:'roulette' });
  for (const p of st.pools) q.push({ type:'pool', pool:p });
  S.queue = q;
  S.phase = 'stageIntro';
}

// 次に進む。画面の種類（phase）を決める
function advance(){
  while (true){
    if (!S.queue.length){
      if (S.stage < STAGES.length-1) { startStage(S.stage+1); return; }
      doRetire(); return;
    }
    const item = S.queue.shift();
    if (item.type==='roulette'){ S.spin = null; S.phase = 'roulette'; return; }
    let ev = null;
    if (item.type==='pool') ev = pickEvent(item.pool);
    if (item.type==='event') ev = getEvent(item.id);
    if (!ev) continue;
    enterEvent(ev);
    return;
  }
}

function enterEvent(ev){
  if (!S.used.includes(ev.id)) S.used.push(ev.id);
  S.current = ev.id;
  if (!ev.options){ resolve(ev, ev); S.phase = 'result'; }
  else S.phase = 'event';
}

function choose(idx){
  const ev = getEvent(S.current);
  resolve(ev, ev.options[idx]);
  S.phase = 'result';
}

// ルーレット：1〜3 ピンチ / 4〜7 ふつう / 8〜10 チャンス
function spinValue(){
  const n = 1 + Math.floor(rand()*10);
  const cat = n<=3 ? 'bad' : n<=7 ? 'normal' : 'good';
  S.spin = { n, cat, done:false };
  S.luck[cat]++;
  return S.spin;
}
function afterSpin(){
  const ev = pickEvent('luck_' + S.spin.cat);
  S.spin.done = true;
  if (ev) enterEvent(ev); else advance();
}

function doRetire(){
  const notes = [];
  const c = CAREERS[S.career];
  const amt = payRetirement(notes);
  S.retire = { amt, careerName: c.name, hadRetire: amt>0 };
  S.log.push({ age:65, text: amt>0 ? `65歳。仕事を終える（退職金 ${fmtMoney(amt)}）` : '65歳。人生の一区切り', pool:'end' });
  S.phase = 'retire';
}

// ---------- 結果 ----------
function norm(st){
  return {
    money: clamp(st.money / MONEY_FULL * 100, 0, 100),
    health: st.health, skill: st.skill, bond: st.bond, joy: st.joy,
  };
}
function scoreOf(st){
  const n = norm(st);
  const parts = {};
  let total = 0;
  for (const k of STAT_KEYS){ parts[k] = Math.round(n[k] / 5); total += parts[k]; }
  return { total, parts, n };
}

function lifeTitle(){
  const { n } = scoreOf(S.stats);
  const sorted = [...STAT_KEYS].sort((a,b)=>n[b]-n[a]);
  const vals = STAT_KEYS.map(k=>n[k]);
  const max = Math.max(...vals), min = Math.min(...vals);
  if (S.flags.fraudFound) return { t:'信頼を取り戻す道を歩んだ人', d:'一度の判断が、人生の流れを大きく変えた。それでも人生は続いていく。' };
  if (S.careers.includes('startup')) return { t:'挑戦し続けた起業家', d:'安定よりも挑戦を選び、自分の手で道を切り開いた人生。' };
  if (S.careers.includes('academia') && n.skill>=70) return { t:'知の探究者', d:'問いを追いかけ続け、知識を次の世代へつないだ人生。' };
  if (min>=60) return { t:'バランスの達人', d:'お金も、健康も、人も、やりがいも。どれも大切に育てた人生。' };
  if (max<50) return { t:'嵐を生き抜いた人', d:'思い通りにいかないことの多い人生。それでも最後まで歩き抜いた。' };
  if (max - min >= 55) {
    const k = sorted[0];
    return { t:`「${META[k].label}」一点突破の人`, d:`${META[k].label}にすべてを注いだ人生。その分、手放したものもあった。` };
  }
  switch (sorted[0]){
    case 'money':  return { t:'コツコツ積み上げた堅実家', d:'着実に働き、着実に蓄えた。将来への備えは万全だ。' };
    case 'health': return { t:'心身しなやかな人', d:'無理をしすぎず、自分を大切にした。元気であることは何よりの財産。' };
    case 'skill':  return { t:'道を極めた専門家', d:'学び続け、腕を磨き続けた。あなたにしかできない仕事がある。' };
    case 'bond':   return S.flags.children>0
                    ? { t:'家族と歩んだ人', d:'家族や仲間との時間を何よりも大切にした人生。' }
                    : { t:'人とつながり続けた人', d:'まわりにはいつも誰かがいた。支え、支えられた人生。' };
    case 'joy':    return { t:'やりたいことを生きた人', d:'「好き」や「やりがい」を軸に選び続けた人生。' };
  }
}

function feedback(){
  const { n } = scoreOf(S.stats);
  const sorted = [...STAT_KEYS].sort((a,b)=>n[b]-n[a]);
  const out = [];

  // 1. 最初に大事にしたかったもの
  if (S.value){
    const rank = sorted.indexOf(S.value);
    const L = META[S.value].label;
    let msg;
    if (rank===0) msg = `最初に「${VALUES[S.value]}」をいちばん大事にしたいと答えました。そのとおり、「${L}」は5つの中でいちばん高い結果に。自分の軸を守り抜いた人生でした。`;
    else if (rank<=2) msg = `最初に「${VALUES[S.value]}」をいちばん大事にしたいと答えました。結果、「${L}」は5つの中で${rank+1}番目。大切にしつつも、ほかのものとの間で揺れた人生でした。`;
    else msg = `最初に「${VALUES[S.value]}」をいちばん大事にしたいと答えましたが、結果は5つの中で${rank+1}番目。どの選択や出来事が影響したのか、年表をふりかえってみましょう。`;
    out.push({ h:'🎯 最初の答えと、実際の人生', p:msg });
  }

  // 2. 伸びたもの・手放したもの
  const top = META[sorted[0]].label, bottom = META[sorted[4]].label;
  out.push({ h:'⚖️ 何を選び、何を手放したか',
    p:`いちばん伸びたのは「${top}」、いちばん低かったのは「${bottom}」。何かを選ぶことは、別の何かを選ばないことでもあります。` });

  // 3. 進路
  const path = S.careers.map(id=>CAREERS[id].short);
  if (path.length===1) out.push({ h:'🧭 キャリア', p:`「${path[0]}」として、ひとつの道を歩き続けました。続けることで得られる信頼や専門性、退職金があります。` });
  else out.push({ h:'🧭 キャリア', p:`${path.join(' → ')} と、${path.length-1}回道を変えました。環境を変えることで得られる成長もあれば、手放すもの（人間関係・勤続年数）もあります。` });

  // 4. 倫理
  if (S.ethics){
    let p;
    if (S.ethics.kind==='comply' && S.flags.fraudFound) p = `「${S.ethics.title}」で、まわりに合わせる選択をし、後に発覚しました。その場で得たものより、失ったもののほうがずっと大きかったはずです。`;
    else if (S.ethics.kind==='comply') p = `「${S.ethics.title}」で、まわりに合わせる選択をしました。今回は発覚しませんでしたが、それは運がよかっただけかもしれません。もし発覚していたら、どうなっていたでしょう。`;
    else if (S.ethics.kind==='speak') p = `「${S.ethics.title}」で、自分の言葉で正しいことを伝えました。関係がぎくしゃくするリスクがあっても、筋を通すことは長い目で信頼につながります。`;
    else p = `「${S.ethics.title}」で、組織の正式なルートを使いました。一人で抱え込まず、仕組みを頼るのも大切な判断です。`;
    out.push({ h:'⚖️ 仕事の倫理', p });
  }

  // 5. 運
  const { good, bad } = S.luck;
  out.push({ h:'🎲 運とのつきあい方',
    p:`ルーレットはチャンス${good}回・ピンチ${bad}回。運は選べません。でも、健康・スキル・つながりがあると、ピンチのときの選択肢が増え、成功しやすくなります（このゲームでも、成功率はパラメータで変わっていました）。` });

  return out;
}

function fmtMoney(v){
  v = Math.round(v);
  const s = Math.abs(v).toLocaleString('ja-JP');
  return (v<0 ? '−' : '') + s + '万円';
}

function statBar(){

  const cells = STAT_KEYS.map(k=>{

    return `<div class="stat" style="--c:${META[k].color}">
      <div class="stat-top"><span class="stat-ic">${META[k].icon}</span><span class="stat-v">${v}</span></div>

      <div class="stat-l">${META[k].label}</div></div>`;
  }).join('');

}
function shortMoney(v){
  v = Math.round(v);
  if (Math.abs(v) >= 10000) return (v/10000).toFixed(1) + '億';
  return (v<0?'−':'') + Math.abs(v).toLocaleString('ja-JP') + '万';
}
function topBar(){

}
function deltaChips(d){

  return `<div class="chips">${ks.map(k=>{
    const v = d[k], up = v>0;

    return `<span class="chip ${up?'up':'down'}">${META[k].icon} ${META[k].label} <b>${txt}</b></span>`;
  }).join('')}</div>`;
}

const WHEEL_COLORS = { bad:['#f2b8b5','#eaa09c'], normal:['#cfe3dc','#b9d6cc'], good:['#ffd98a','#ffcb5c'] };
function wheelSVG(){
  const R = 120, cx = 130, cy = 130;
  let s = '';
  for (let k=1; k<=10; k++){
    const a0 = (k-1)*36 - 90, a1 = k*36 - 90;
    const p0 = [cx + R*Math.cos(a0*Math.PI/180), cy + R*Math.sin(a0*Math.PI/180)];
    const p1 = [cx + R*Math.cos(a1*Math.PI/180), cy + R*Math.sin(a1*Math.PI/180)];
    const cat = k<=3?'bad':k<=7?'normal':'good';
    const col = WHEEL_COLORS[cat][k%2];
    const am = (a0+a1)/2*Math.PI/180;
    const tx = cx + R*0.72*Math.cos(am), ty = cy + R*0.72*Math.sin(am);
    s += `<path d="M${cx},${cy} L${p0[0]},${p0[1]} A${R},${R} 0 0 1 ${p1[0]},${p1[1]} Z" fill="${col}" stroke="#fff" stroke-width="2"/>`;
    s += `<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="central" transform="rotate(${(a0+a1)/2+90} ${tx} ${ty})" class="wnum">${k}</text>`;
  }
  s += `<circle cx="${cx}" cy="${cy}" r="22" fill="#fff" stroke="#23262b" stroke-width="3"/>`;
  return `<svg viewBox="0 0 260 260" class="wheel-svg">${s}</svg>`;
}
function renderRoulette(){
  app.innerHTML = `${topBar()}
  <div class="screen center">
    <p class="step">ルーレット</p>
    <h2>この時期、何が起きる？</h2>
    <div class="legend"><span class="lg bad">1〜3 ピンチ</span><span class="lg normal">4〜7 ふつう</span><span class="lg good">8〜10 チャンス</span></div>
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <div class="wheel" id="wheel">${wheelSVG()}</div>
    </div>
    <div id="spinout" class="spinout"></div>
    ${btn('ルーレットを回す','primary','spin')}
  </div>`;
  const b = document.getElementById('spin');
  // 回した直後に再読み込みされた場合は、結果を表示したところから
  if (S.spin && !S.spin.done){
    const sp = S.spin;
    document.getElementById('wheel').style.cssText = `transition:none;transform:rotate(${360-((sp.n-1)*36+18)}deg)`;
    const label = { bad:'ピンチ！', normal:'ふつうの日々', good:'チャンス！' }[sp.cat];
    document.getElementById('spinout').innerHTML = `<div class="spin-res ${sp.cat}"><b>${sp.n}</b>${label}</div>`;
    b.textContent = '何が起きた？';
    b.onclick = go(afterSpin);
    return;
  }
  b.onclick = () => {
    b.disabled = true;
    const sp = spinValue(); save();
    const center = (sp.n-1)*36 + 18;
    const jitter = (Math.random()*2-1)*12;
    const rot = 360*6 - center + jitter;
    const w = document.getElementById('wheel');
    requestAnimationFrame(()=>{ w.style.transform = `rotate(${rot}deg)`; });
    setTimeout(() => {
      const label = { bad:'ピンチ！', normal:'ふつうの日々', good:'チャンス！' }[sp.cat];
      document.getElementById('spinout').innerHTML = `<div class="spin-res ${sp.cat}"><b>${sp.n}</b>${label}</div>`;
      b.textContent = '何が起きた？'; b.disabled = false;
      b.onclick = go(afterSpin);
    }, 3300);
  };
}

  document.getElementById('next').onclick = go(advance);
}

// ---------- エンディング ----------
function radarSVG(n){
  const cx=130, cy=118, R=82;
  const pt = (i, r) => { const a = (-90 + i*72) * Math.PI/180; return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; };
  let grid = '';
  for (const f of [0.25,0.5,0.75,1]){
    grid += `<polygon points="${STAT_KEYS.map((_,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="#e3ddcf" stroke-width="1"/>`;
  }
  let axes = '', labels = '';
  STAT_KEYS.forEach((k,i)=>{
    const [x,y] = pt(i,R);
    axes += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e3ddcf"/>`;
    const [lx,ly] = pt(i,R+22);
    labels += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central" class="rl">${META[k].icon}${META[k].label}</text>`;
  });
  const poly = STAT_KEYS.map((k,i)=>pt(i, R*Math.max(4,n[k])/100).join(',')).join(' ');
  const dots = STAT_KEYS.map((k,i)=>{ const [x,y]=pt(i,R*Math.max(4,n[k])/100); return `<circle cx="${x}" cy="${y}" r="4" fill="${META[k].color}"/>`; }).join('');
  return `<svg viewBox="0 0 260 240" class="radar">${grid}${axes}<polygon points="${poly}" fill="rgba(15,118,110,.22)" stroke="#0f766e" stroke-width="2.5"/>${dots}${labels}</svg>`;
}
function renderEnding(){
  const sc = scoreOf(S.stats);
  const title = lifeTitle();
  const fb = feedback();
  const path = S.careers.map(id=>`${CAREERS[id].icon}${CAREERS[id].short}`).join(' → ');
  const tips = [...S.tips, ...BASE_TIPS].slice(0,6);
  const vals = STAT_KEYS.map(k=>`<div class="rv" style="--c:${META[k].color}">
      <span>${META[k].icon}</span><b>${k==='money'?shortMoney(S.stats.money):S.stats[k]}</b><small>${META[k].label}</small><em>${sc.parts[k]}点</em></div>`).join('');

  app.innerHTML = `
  <div class="screen ending">
    <div class="result-card" id="shot">
      <div class="rc-head">
        <p class="rc-name">${esc(S.name)}さんの人生</p>
        <p class="rc-kicker">人生の称号</p>
        <h2 class="rc-title">${esc(title.t)}</h2>
        <p class="rc-desc">${esc(title.d)}</p>
      </div>
      <div class="rc-score"><span class="num">${sc.total}</span><span class="unit">点</span><small>人生スコア（100点満点）</small></div>
      ${radarSVG(sc.n)}
      <div class="rv-row">${vals}</div>
      <p class="rc-path">${path}</p>
      <p class="rc-foot">バイオ人生ゲーム</p>
    </div>
    <p class="shot-note">📸 ここまでをスクショしてシェアしよう</p>
    <p class="fine center">スコアは5つの軸（各20点）の合計です。人生の価値そのものではありません。<br>資産は${MONEY_FULL.toLocaleString()}万円で20点として計算しています。</p>

    <section class="sec"><h3>ふりかえり</h3>
      ${fb.map(f=>`<div class="fb"><h4>${f.h}</h4><p>${esc(f.p)}</p></div>`).join('')}
    </section>

    <section class="sec"><h3>人生年表</h3>
      <ol class="timeline">${S.log.map(l=>`<li><span class="tl-age">${l.age}歳</span><span class="tl-t">${esc(l.text)}</span></li>`).join('')}</ol>
    </section>

    <section class="sec"><h3>知っておきたいこと</h3>
      <ul class="tips">${tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
    </section>

    <section class="sec q"><h3>考えてみよう</h3>
      <ol>${QUESTIONS.map(q=>`<li>${esc(q)}</li>`).join('')}</ol>
    </section>

    ${btn('もう一度、別の人生を生きる','primary','again')}
  </div>`;
  document.getElementById('again').onclick = () => {
    const name = S.name; clearSave(); S = newState(); S.name = name; render();
  };
}

// ---------- 起動 ----------
S = newState();
render();
